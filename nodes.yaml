# Ontology: what exists and what depends on what.
# This file is hand-edited and lives in git. It changes rarely.
# Your review history lives in state.json and is written by tooling.
#
# Fields:
#   id         slug, permanent, referenced by deps -- never rename
#   title      human name
#   branch     top-level grouping, used for filtering
#   kind       concept | technique | result | model  (decides default review action)
#   importance 1-3, how central to your curriculum
#   deps       HARD prerequisites only: you cannot do this without that
#   related    associative links; ignored by layout and priority
#   claim      one sentence, in your own words, of what this node says or does
#   practice   at least one concrete thing to DO -- required
#   refs       where to read it up

- id: limit-definition
  title: Limit of a function
  branch: calculus
  kind: concept
  importance: 3
  deps: []
  claim: >
    $f(x)$ -> $L$ as $x$ -> $a$ means we can force $f$ within any tolerance of $L$
    by restricting $x$ to a small enough punctured interval around a.
  practice:
    - "Stewart 8e S2.4 #15-24 (epsilon-delta)"
    - "State the definition from blank paper, then negate it"
  refs:
    - "Stewart 8e S2.2, S2.4"

- id: derivative-definition
  title: Derivative as a limit
  branch: calculus
  kind: concept
  importance: 3
  deps: [limit-definition]
  claim: >
    $f'(a)$ is the limit of the difference quotient; it is the instantaneous
    rate of change and the slope of the tangent line.
  practice:
    - "Stewart 8e S2.7 #25-34 (differentiate from the definition)"
  refs:
    - "Stewart 8e S2.7, S2.8"

- id: power-rule
  title: Power rule
  branch: calculus
  kind: technique
  importance: 3
  deps: [derivative-definition]
  claim: >
    $\frac{d}{dx} x^n = n x^{n-1}$, for all real $n$.
  practice:
    - "Stewart 8e S3.1 #3-30"
  refs:
    - "Stewart 8e S3.1"

- id: product-rule
  title: Product rule
  branch: calculus
  kind: technique
  importance: 3
  deps: [derivative-definition]
  claim: >
    $(fg)' = f'g + fg'$.
  practice:
    - "Stewart 8e S3.2 #3-26"
    - "Derive it from the difference quotient without looking"
  refs:
    - "Stewart 8e S3.2"

- id: quotient-rule
  title: Quotient rule
  branch: calculus
  kind: technique
  importance: 2
  deps: [product-rule]
  related: [chain-rule]
  claim: >
    $(\frac{f}{g})' = \frac{f'g - fg'}{g^2}$.
  practice:
    - "Stewart 8e S3.2 #27-43"
  refs:
    - "Stewart 8e S3.2"

- id: chain-rule
  title: Chain rule
  branch: calculus
  kind: technique
  importance: 3
  deps: [derivative-definition]
  claim: >
    $(f o g)'(x) = f'(g(x)) g'(x)$; rates of change compose multiplicatively.
  practice:
    - "Stewart 8e S3.4 #7-46"
  refs:
    - "Stewart 8e S3.4"

- id: implicit-differentiation
  title: Implicit differentiation
  branch: calculus
  kind: technique
  importance: 2
  deps: [chain-rule]
  claim: >
    Differentiate both sides of an unsolved relation in $x$ and $y$, treating $y$
    as a function of $x$, then solve for $\frac{dy}{dx}$.
  practice:
    - "Stewart 8e S3.5 #5-20"
  refs:
    - "Stewart 8e S3.5"

- id: related-rates
  title: Related rates
  branch: calculus
  kind: technique
  importance: 2
  deps: [chain-rule, implicit-differentiation]
  claim: >
    Link two changing quantities by an equation, differentiate with respect
    to time, and solve for the unknown rate.
  practice:
    - "Stewart 8e S3.9 #11-33"
  refs:
    - "Stewart 8e S3.9"

- id: riemann-sum
  title: Riemann sums
  branch: calculus
  kind: concept
  importance: 2
  deps: [limit-definition]
  claim: >
    Area under a curve is approximated by summing rectangle areas; the
    integral is the limit as the partition is refined.
  practice:
    - "Stewart 8e S5.1 #5-18"
  refs:
    - "Stewart 8e S5.1"

- id: definite-integral
  title: The definite integral
  branch: calculus
  kind: concept
  importance: 3
  deps: [riemann-sum]
  claim: >
    The definite integral is the limit of Riemann sums, and is a number, not
    a family of functions.
  practice:
    - "Stewart 8e S5.2 #33-48"
  refs:
    - "Stewart 8e S5.2"

- id: ftc
  title: Fundamental theorem of calculus
  branch: calculus
  kind: result
  importance: 3
  deps: [definite-integral, derivative-definition]
  claim: >
    Differentiation and integration are inverse operations: the accumulation
    function of $f$ has derivative $f$, and definite integrals are computed by
    evaluating any antiderivative at the endpoints.
  practice:
    - "Stewart 8e S5.3 #7-48"
    - "State both parts and sketch the proof of Part 1 from blank paper"
  refs:
    - "Stewart 8e S5.3"

- id: u-substitution
  title: Substitution rule
  branch: calculus
  kind: technique
  importance: 3
  deps: [chain-rule, ftc]
  claim: >
    Substitution is the chain rule run backwards; changing variables must
    also change the limits of integration.
  practice:
    - "Stewart 8e S5.5 #7-46"
  refs:
    - "Stewart 8e S5.5"

- id: integration-by-parts
  title: Integration by parts
  branch: calculus
  kind: technique
  importance: 3
  deps: [product-rule, ftc]
  related: [u-substitution]
  claim: >
    Turns the integral of u dv into uv minus the integral of v du; used when
    one factor simplifies under differentiation.
  practice:
    - "Stewart 8e S7.1 #3-20, 41-45"
  refs:
    - "Stewart 8e S7.1"

- id: trig-substitution
  title: Trigonometric substitution
  branch: calculus
  kind: technique
  importance: 1
  deps: [u-substitution]
  claim: >
    Radicals of the form $a^2 - x^2$, $a^2 + x^2$, $x^2 - a^2$ are cleared by
    substituting a $sin$, a $tan$, or a $sec$ respectively.
  practice:
    - "Stewart 8e S7.3 #1-24"
  refs:
    - "Stewart 8e S7.3"
